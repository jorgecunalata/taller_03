[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-automated-response"
version = "0.1.0"
description = "Taller 3: grafo LangGraph de cinco agentes para responder un RFP RTGS/ATS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.12",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "qdrant-client>=1.15",
    "numpy>=2.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rfp-agent = "rfp_agent.cli:main"

[tool.setuptools.packages.find]
include = ["rfp_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
